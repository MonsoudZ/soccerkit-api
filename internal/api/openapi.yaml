openapi: 3.0.3
info:
  title: SoccerCoachKit API
  description: >-
    Backend for SoccerCoachKit — a coach → club evaluation platform. Models the
    whole castle (organizations, roles, persons, guardianships, time-bounded
    roster memberships, a generic evaluation engine, polymorphic sharing) while
    Phase 1 ships the solo-coach surface: identity, teams + roster, and the
    pre/post-game evaluation loop with cross-instance score aggregation.
  version: 0.2.0
servers:
  - url: /
    description: Current host
tags:
  - name: auth
  - name: me
  - name: persons
  - name: teams
  - name: evaluation
  - name: attendance
  - name: sync

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness probe — is this process running?
      description: >
        Touches nothing and always answers 200 while the process is up. Use it for a
        supervisor's restart decision. Do NOT use it for load-balancer membership: it
        cannot tell you whether the process can serve a request, and a database that
        goes away after boot leaves it answering OK while every request fails.
      responses: { "200": { description: OK } }

  /ready:
    get:
      tags: [system]
      summary: Readiness probe — can this process serve a request?
      description: >
        Pings the database under a short timeout. This is the one a load balancer should
        use to decide whether to send traffic here.
      responses:
        "200": { description: Ready }
        "503":
          description: A dependency is unreachable; do not route traffic here
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  reason: { type: string }

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate a refresh token for a new token pair
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/v1/auth/apple:
    post:
      tags: [auth]
      summary: Sign in with Apple
      description: >
        Verifies an Apple identity token and resolves it to a Person: an account already
        linked by Apple subject, or a freshly provisioned identity — the same provisioning
        as email registration, including the seeded evaluation templates.


        This is the only way to obtain a session. There is no registration and no
        password login: they were removed because nothing shipped used them and they let
        anyone create an account at any address, which made an address a takeover
        primitive.


        It does NOT match an existing account by email address. When the address already
        belongs to another account this endpoint answers 409 EMAIL_ALREADY_REGISTERED —
        a state no API call can now produce, so it means the data needs looking at, not
        that the caller did something wrong.


        When the user hides their address — or Apple has not marked it verified — a stable
        synthesized address is used, which never collides with a real account.


        The response shape is the iOS app's, not the shared AuthResponse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityToken]
              properties:
                identityToken:
                  type: string
                  description: The identity token from ASAuthorizationAppleIDCredential.
                authorizationCode:
                  type: string
                  nullable: true
                  description: The one-time authorization code. Accepted, not yet used.
                fullName:
                  type: string
                  nullable: true
                  description: >
                    Apple sends the name only on the very first authorization, so send it
                    when present or the display name falls back to the email local part.
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Access token (JWT). Same token type as accessToken elsewhere.
                  refreshToken: { type: string }
                  personID: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409":
          description: >
            Two distinct cases, told apart by the error code, because a client may want
            to word them differently. EMAIL_ALREADY_REGISTERED — the address belongs to
            another account. CONFLICT — the Person id this Apple subject derives is
            already taken by a row this sign-in did not create. Neither is a retry: both
            mean somebody has to look at the data.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/v1/sync:
    get:
      tags: [sync]
      summary: Pull the changes this account has not seen
      description: >
        Delta sync for the offline-first iOS app. Returns every record written after the
        client's cursor, unioned across the projected domain tables and the generic
        document store, scoped to the authenticated account.


        Projected types (Team, Drill, Session, Person, Player, Event, Diagram) land in
        their real tables with columns projected out of the payload and the full payload
        retained; every other type round-trips losslessly through a generic store until
        it graduates. Either way the wire format is the same opaque {type, id, payload}.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: since
          schema: { type: string }
          description: >
            The cursor from a previous response. Omit for a full sync.


            It must be a non-negative integer this server issued. Anything else — a
            negative or unparseable value — is a 400: it can only be a client bug, and
            answering it with a silent full sync hid that bug behind an expensive pull.


            A cursor *above* the server's sequence is not an error and not the client's
            fault. It means the sequence moved backwards under a device that had already
            passed it, which is what restoring the database does. Such a cursor is
            answered with a full sync from the beginning and logged server-side; the
            device converges on its own. Note that rows the restore removed left no
            tombstone, so a device may still hold those locally.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncPullResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [sync]
      summary: Push local changes
      description: >
        Applies the client's changes in one transaction. Writes are last-write-wins
        within an account.


        A record naming a row this account does not own affects nothing and comes back in
        `conflicts`, so a rejected write is visible rather than silently lost. Rows created
        through the REST API are owned by no sync account and cannot be adopted this way.


        The response carries no cursor: `cursor` is always null. Pull owns the read
        position. Advancing it here would skip a second device's interleaved changes —
        seqs come from one global sequence, so a client told its own push's high-water
        mark never sees the rows another device wrote just below it. Echoing the request's
        cursor, which this used to do, rewinds a client whose pull has moved on since the
        request was built. Sending nothing leaves the client's position alone.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncPushRequest" }
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncPushResponse" }
        "400":
          description: >
            Malformed record, or a batch over the 1000-record limit. Nothing is written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/me:
    get:
      tags: [me]
      summary: The authenticated person and their org memberships
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      tags: [me]
      summary: Delete the authenticated account and all its data
      description: >
        Permanently erases the caller's account and everything it owns — their
        personal organization (and its teams, drills, sessions, templates, games
        and share-grants), their synced content, and their athletes' Person rows
        including PII (name, birthdate, medical notes). Runs in one transaction
        and is idempotent: a retry, or a delete of an already-gone account,
        returns 204. An athlete still rostered under another coach is preserved.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Account deleted (or already absent) }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/persons:
    post:
      tags: [persons]
      summary: Add a person (athlete) to your organization
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePersonRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/persons/{id}:
    get:
      tags: [persons]
      summary: Get a person
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [persons]
      summary: Edit a person
      description: >
        Partial update: an absent field is left alone and an explicit null clears a
        nullable one. displayName, emergencyContactName, emergencyContactPhone and
        medicalNotes are part of the sync contract, so an edit to any of them is
        propagated into the record /api/v1/sync returns and reaches the app. givenName,
        familyName, birthdate, email and phone exist only on this API and are not
        synced. email is contact information, not a credential -- sign-in matches on the
        verified Apple address, which is not reachable from here. You may always edit
        yourself; a coach may edit a person in their organization who has no account of
        their own.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                displayName: { type: string, minLength: 1 }
                givenName: { type: string, nullable: true }
                familyName: { type: string, nullable: true }
                birthdate: { type: string, format: date, nullable: true, example: "2013-04-02" }
                email: { type: string, nullable: true }
                phone: { type: string, nullable: true }
                emergencyContactName: { type: string, nullable: true }
                emergencyContactPhone: { type: string, nullable: true }
                medicalNotes: { type: string, nullable: true }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/persons/{id}/guardians:
    get:
      tags: [persons]
      summary: List a child's recorded guardians
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Person" } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [persons]
      summary: Record a guardian for this child
      description: >
        Staff only, and both people must already be visible in the organization. This is
        what narrows the parent role: a parent sees the children they are a guardian of
        and no others, so being able to attach yourself to an arbitrary id would be a
        one-call escalation.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [personId]
              properties:
                personId: { type: string, format: uuid }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  childPersonId: { type: string, format: uuid }
                  guardianPersonId: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/persons/{id}/guardians/{personId}:
    delete:
      tags: [persons]
      summary: Remove a guardian from this child
      description: Idempotent — removing a link that is already gone succeeds.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/PersonId" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/persons/{id}/instances:
    get:
      tags: [persons, evaluation]
      summary: List a person's evaluation instances (most recent first)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { in: query, name: context, schema: { $ref: "#/components/schemas/FormContext" } }
        - { in: query, name: limit, schema: { type: integer, default: 50 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/InstanceSummary" } }
  /api/v1/persons/{id}/aggregate:
    get:
      tags: [persons, evaluation]
      summary: Cross-instance score averages for an athlete (readiness mean / effort trend)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { in: query, name: context, schema: { $ref: "#/components/schemas/FormContext" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ScoreAggregate" } }

  /api/v1/organizations/{id}:
    patch:
      tags: [organizations]
      summary: Rename the organization you are acting in
      description: >
        Only the name may be changed. `kind` is deliberately not editable: it decides
        whether account deletion destroys the organization or orphans it. The id must be
        the organization you are acting in -- set X-Organization-ID if you belong to
        more than one. Organizations carry no sync record, so nothing is propagated.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/organizations/{id}/members:
    get:
      tags: [organizations]
      summary: List the organization's members and their roles
      description: >
        Staff only (admin, director or coach). The list carries names and sign-in
        addresses, which is a club directory rather than something every family is owed
        about the others. Roles are stored one per row, so a person holding two comes
        back once with both.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Member" } }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/organizations/{id}/members/{personId}:
    patch:
      tags: [organizations]
      summary: Replace a member's roles
      description: >
        Replaces the whole set. You cannot grant a role above your own, cannot change
        someone who outranks you, and cannot leave the organization without an admin or
        strip the owner's admin role -- there is no endpoint that could put either back.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/PersonId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  personId: { type: string, format: uuid }
                  roles: { type: array, items: { $ref: "#/components/schemas/Role" } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [organizations]
      summary: Remove a member from the organization
      description: >
        Removes every role they hold in it. Subject to the same guards as a role change:
        not someone who outranks you, not the owner, and not the last admin.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/PersonId" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/organizations/{id}/invitations:
    get:
      tags: [organizations]
      summary: List the organization's outstanding invitations
      description: Staff only. Expired invitations are not listed.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Invitation" } }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [organizations]
      summary: Invite an address to join the organization
      description: >
        Replaces the direct add that used to live at POST .../members. Nobody joins until
        they accept. The address need not have an account yet — the invitation waits and
        appears the first time they sign in with it, which is also why this cannot be used
        to probe for who has signed up. Requires admin, director or the owner, and you
        cannot grant a role above your own. One live invitation per address per
        organization; declining or revoking frees it.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, roles]
              properties:
                email: { type: string }
                roles:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/organizations/{id}/invitations/{invitationId}:
    delete:
      tags: [organizations]
      summary: Revoke an invitation that has not been answered
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/InvitationId" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/me/devices:
    post:
      tags: [me]
      summary: Register this device for push notifications
      description: >
        Idempotent — the app registers on every launch and Apple reissues the same token
        for the same install. Registering also re-points the token at the caller, which is
        what has to happen when a device changes hands: the token identifies the install,
        not the person.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: The APNs device token, 64 hex characters.
                  pattern: "^[0-9a-fA-F]{64}$"
                platform: { type: string, enum: [ios], default: ios }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/me/devices/{token}:
    delete:
      tags: [me]
      summary: Stop push notifications to this device
      description: >
        What sign-out should call. Idempotent, and scoped to the caller — holding someone
        else's token is not enough to silence their phone.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F]{64}$" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/me/teams:
    get:
      tags: [me]
      summary: The teams you are rostered on
      description: >
        Narrower than GET /teams, which answers what you may *see*. This is what you are
        part of, with the jersey number, position and dates that belong to the membership
        rather than to the team. Past memberships are included, `leftOn` and all — a
        season that ended is the larger part of an athlete's record.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MyTeam" } }
  /api/v1/me/invitations:
    get:
      tags: [me]
      summary: Invitations addressed to you
      description: >
        Matched on the verified address on your account, which is the whole of the
        authentication an invitation carries — there is no token to hold or forward.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Invitation" } }
  /api/v1/invitations/{invitationId}/accept:
    post:
      tags: [me]
      summary: Accept an invitation, granting its roles
      description: >
        Not scoped to an organization — you are not a member of it yet. An invitation
        addressed to another account answers 404, and one already answered or expired
        answers 409.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/InvitationId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  organizationId: { type: string, format: uuid }
                  status: { type: string }
                  roles: { type: array, items: { $ref: "#/components/schemas/Role" } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/invitations/{invitationId}/decline:
    post:
      tags: [me]
      summary: Decline an invitation
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/InvitationId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  organizationId: { type: string, format: uuid }
                  status: { type: string }
                  roles: { type: array, items: { $ref: "#/components/schemas/Role" } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/teams:
    get:
      tags: [teams]
      summary: List the teams you can see
      description: >
        An admin or director sees every team in the organization; everyone else sees the
        teams they are connected to — the ones a coach staffs, the ones a player is
        rostered on, the ones a parent's children are on. A coach who staffs no teams
        sees none, which is the answer to "your teams" rather than an error.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgHeader" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Team" } }
    post:
      tags: [teams]
      summary: Create a team
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTeamRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
  /api/v1/teams/{id}:
    get:
      tags: [teams]
      summary: Get a team with its active roster
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  team: { $ref: "#/components/schemas/Team" }
                  roster: { type: array, items: { $ref: "#/components/schemas/RosterEntry" } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [teams]
      summary: Edit a team
      description: >
        Partial update: an absent field is left alone and an explicit null clears a
        nullable one. All three fields are part of the sync contract, so an edit is
        propagated into the record /api/v1/sync returns and reaches the app; fields the
        server does not project are preserved rather than dropped.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1 }
                ageGroup: { type: string, nullable: true }
                season: { type: string, nullable: true }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [teams]
      summary: Delete a team
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/teams/{id}/staff:
    get:
      tags: [teams]
      summary: Who runs this team
      description: Staff only, matching who may read the member directory.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Person" } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [teams]
      summary: Put a coach on this team
      description: >
        Assigning staff decides who sees the team at all — GET /teams scopes a coach to
        the teams they staff — so it takes the same gate as managing members. The person
        must already hold admin, director or coach in the organization: this says which
        teams someone coaches, not that they coach.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [personId]
              properties:
                personId: { type: string, format: uuid }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  teamId: { type: string, format: uuid }
                  personId: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/teams/{id}/staff/{personId}:
    delete:
      tags: [teams]
      summary: Take a coach off this team
      description: >
        Idempotent, and it cannot strand anyone — an admin or director sees every team
        regardless of who staffs it.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/PersonId" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/teams/{id}/roster:
    post:
      tags: [teams]
      summary: Add a person to the team roster (opens a time-bounded membership)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddRosterRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RosterEntry" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/teams/{id}/roster/{personId}:
    delete:
      tags: [teams]
      summary: End a player's active roster membership (leave / move)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/PersonId" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/templates:
    get:
      tags: [evaluation]
      summary: List evaluation templates available to you
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OrgHeader" }
        - { in: query, name: context, schema: { $ref: "#/components/schemas/FormContext" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FormTemplate" } }
    post:
      tags: [evaluation]
      summary: Create a custom evaluation template
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTemplateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormTemplate" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/templates/{id}:
    get:
      tags: [evaluation]
      summary: Get a template with its fields
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormTemplate" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/form-instances:
    post:
      tags: [evaluation]
      summary: Submit a filled-out evaluation (instance + normalized answers)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitInstanceRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormInstance" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/form-instances/{id}:
    get:
      tags: [evaluation]
      summary: Get an evaluation instance with its answers
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormInstance" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/drills:
    get:
      tags: [content]
      summary: List drills in your organization
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgHeader" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Drill" } }
    post:
      tags: [content]
      summary: Create a drill
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Drill" }

  /api/v1/sessions:
    get:
      tags: [content]
      summary: List training sessions
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OrgHeader" }
        - { in: query, name: teamId, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Session" } }
    post:
      tags: [content]
      summary: Create a training session with blocks
      description: >
        When the session names a team, its squad and their parents are pushed an ask to
        reply — see the attendance endpoints. A session with no team tells nobody: there
        is no roster, and a plan a coach is drafting for themselves is not an event.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSessionRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /api/v1/sessions/{id}:
    get:
      tags: [content]
      summary: Get a session with its blocks
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [content]
      summary: Move, rename or re-note a session
      description: >
        Every field is a three-state PATCH: omit to leave alone, send a value to set,
        send explicit null to clear. A changed time pushes to the squad, the same as a
        moved kickoff; a rename does not. Blocks are not editable here — replacing the
        plan is a different operation from editing the session. Moving a session to
        another team is refused once its register has been answered: those replies are
        about a specific squad's training and cannot be carried onto another's.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSessionRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The session already has a register and cannot change team
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [content]
      summary: Delete a session
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/v1/teams/{id}/games:
    get:
      tags: [games]
      summary: List a team's games
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Game" } }
    post:
      tags: [games]
      summary: Schedule a game
      description: >
        Pushes an ask to reply to the team's squad and their parents — anyone with a
        registered device, minus whoever scheduled it. The kickoff instant rides in the
        payload rather than the text: the server does not know the club's timezone.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGameRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Game" }
  /api/v1/games/{id}:
    get:
      tags: [games]
      summary: Get a game
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Game" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [games]
      summary: Update a game (record kickoff, status, and result)
      description: >
        Two of these changes push to the squad: a kickoff that moved, and a status that
        became cancelled. A corrected opponent or a scoreline entered at full time does
        not — a push per edit would train a squad to ignore the two that matter.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateGameRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Game" }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/games/{id}/attendance:
    get:
      tags: [attendance]
      summary: Who is coming to this game, and who came
      description: >
        Staff get the whole squad. A player gets their own line and a parent their
        children's, because the sheet names people. The counts are the squad's either
        way — how many replied is not a disclosure about any one of them. Lines are
        included for people who have since left the team (onRoster false): they were
        still at the fixture.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceSheet" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/games/{id}/rsvp:
    put:
      tags: [attendance]
      summary: Reply for yourself, your child, or (as staff) a player
      description: >
        Idempotent — one reply per person per game, replaced each time. There is no way
        to un-answer; not_going is what a retraction means. Refused on a cancelled
        fixture.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RSVPRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceEntry" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/games/{id}/attendance/{personId}:
    patch:
      tags: [attendance]
      summary: Record whether a player actually turned up (staff only)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/PersonId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordAttendanceRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceEntry" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/sessions/{id}/attendance:
    get:
      tags: [attendance]
      summary: Who is coming to this training session, and who came
      description: >
        The same register as a game's, for the other scheduled thing. Unlike the rest of
        /sessions this is not staff-only: a player has to be able to see the training
        they are expected at, which is a different question from how it will be run.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceSheet" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The session is not attached to a team, so it has no roster
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/sessions/{id}/rsvp:
    put:
      tags: [attendance]
      summary: Reply to a training session
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RSVPRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceEntry" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/sessions/{id}/attendance/{personId}:
    patch:
      tags: [attendance]
      summary: Record training attendance (staff only)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/PersonId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordAttendanceRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceEntry" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    InvitationId:
      in: path
      name: invitationId
      required: true
      schema: { type: string, format: uuid }
    PersonId:
      in: path
      name: personId
      required: true
      schema: { type: string, format: uuid }
    OrgHeader:
      in: header
      name: X-Organization-ID
      required: false
      description: Act within a specific organization; defaults to your single/first org.
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Ok:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties: { ok: { type: boolean } }
  schemas:
    SyncRecord:
      type: object
      description: One synced entity. The payload is opaque to the server beyond the few columns it projects out.
      properties:
        type:
          type: string
          description: Client type name, e.g. Team, Drill, Session, Person, Player, Event, Diagram, Prefs.
          example: Team
        id:
          type: string
          description: >
            The client's id for the record. A UUID for every projected type; free-form
            text for types held in the generic store.
        payload:
          type: object
          additionalProperties: true
          nullable: true
    SyncKey:
      type: object
      description: Identifies a record without its body, used for deletes.
      properties:
        type: { type: string }
        id: { type: string }
    SyncPullResponse:
      type: object
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/SyncRecord" }
        deletes:
          type: array
          description: Tombstones — records deleted since the client's cursor.
          items: { $ref: "#/components/schemas/SyncKey" }
        cursor:
          type: string
          nullable: true
          description: Pass as `since` on the next pull.
    SyncPushRequest:
      type: object
      properties:
        upserts:
          type: array
          items: { $ref: "#/components/schemas/SyncRecord" }
        deletes:
          type: array
          items: { $ref: "#/components/schemas/SyncKey" }
        cursor:
          type: string
          nullable: true
          description: >-
            Where the client has read up to. Accepted and ignored — the response
            does not echo it back. Only a pull advances the cursor.
      description: >-
        At most 1000 records across upserts and deletes combined. A record's `type` must
        be a record type name (letters, digits, underscore, dot and dash, starting with a
        letter) of at most 64 characters, its `id` at most 128, and its `payload` at most
        256 KiB. A record over any of those is a 400 naming it, so a client can act on
        the specific record rather than retrying the batch forever.
    SyncPushResponse:
      type: object
      properties:
        cursor:
          type: string
          nullable: true
          description: >-
            Always null. Present for shape stability; a push never moves the
            client's read position.
        conflicts:
          type: array
          description: >
            Records that were not applied because this account does not own the target
            row. Empty on a clean push.
          items: { $ref: "#/components/schemas/SyncRecord" }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
    Role:
      type: string
      enum: [admin, director, coach, parent, player]
      description: >
        Roles are stored one per membership row, so a person may hold several in the same
        organization. admin, director and coach are staff and see the whole club; parent
        sees only their recorded children, and player only themselves.
    FormContext:
      type: string
      enum: [tryout, pre_game, post_game, development, movement, coach_review]
    FieldKind:
      type: string
      enum: [scale, bool, number, text, select]
    Person:
      type: object
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        givenName: { type: string, nullable: true }
        familyName: { type: string, nullable: true }
        birthdate: { type: string, nullable: true, description: "YYYY-MM-DD" }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        emergencyContactName: { type: string, nullable: true }
        emergencyContactPhone: { type: string, nullable: true }
        medicalNotes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    Membership:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        organizationKind: { type: string, enum: [personal, club] }
        role: { $ref: "#/components/schemas/Role" }
    Me:
      type: object
      properties:
        person: { $ref: "#/components/schemas/Person" }
        memberships: { type: array, items: { $ref: "#/components/schemas/Membership" } }
    AuthResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        me: { $ref: "#/components/schemas/Me" }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    CreatePersonRequest:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string }
        givenName: { type: string }
        familyName: { type: string }
        birthdate: { type: string, description: "YYYY-MM-DD" }
        email: { type: string }
        phone: { type: string }
        emergencyContactName: { type: string }
        emergencyContactPhone: { type: string }
        medicalNotes: { type: string }
        role:
          type: string
          enum: [player, parent]
          default: player
          description: >
            Role the new person holds in your organization. Every person created here is
            enrolled in it — a person with no organizational linkage would be visible to
            nobody, including you. Only the unprivileged roles can be granted this way,
            because the person has no login.
    Invitation:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        email: { type: string }
        roles: { type: array, items: { $ref: "#/components/schemas/Role" } }
        status: { type: string, enum: [pending, accepted, declined, revoked] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        invitedByName: { type: string, nullable: true }
        organizationName: { type: string, nullable: true }
    MyTeam:
      type: object
      properties:
        teamId: { type: string, format: uuid }
        teamName: { type: string }
        jerseyNumber: { type: integer, nullable: true }
        position: { type: string, nullable: true }
        joinedOn: { type: string, format: date, nullable: true }
        leftOn: { type: string, format: date, nullable: true }
    Member:
      type: object
      properties:
        personId: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string, nullable: true }
        roles: { type: array, items: { $ref: "#/components/schemas/Role" } }
        isOwner: { type: boolean }
    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [personal, club] }
        createdAt: { type: string, format: date-time }
    Team:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        ageGroup: { type: string, nullable: true }
        season: { type: string, nullable: true }
        activeRosterCount: { type: integer }
        createdAt: { type: string, format: date-time }
    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        ageGroup: { type: string }
        season: { type: string }
    RosterEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        personId: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string, nullable: true }
        birthdate: { type: string, nullable: true }
        jerseyNumber: { type: integer, nullable: true }
        position: { type: string, nullable: true }
        joinedOn: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }
    AddRosterRequest:
      type: object
      required: [personId]
      properties:
        personId: { type: string, format: uuid }
        jerseyNumber: { type: integer }
        position: { type: string }
        joinedOn: { type: string, description: "YYYY-MM-DD; defaults to today" }
    FormField:
      type: object
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        label: { type: string }
        kind: { $ref: "#/components/schemas/FieldKind" }
        position: { type: integer }
        config: { nullable: true }
    FormTemplate:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid, nullable: true }
        context: { $ref: "#/components/schemas/FormContext" }
        name: { type: string }
        subjectType: { type: string, enum: [athlete, coach, team] }
        version: { type: integer }
        isSeed: { type: boolean }
        fields: { type: array, items: { $ref: "#/components/schemas/FormField" } }
    CreateTemplateRequest:
      type: object
      required: [context, name, fields]
      properties:
        context: { $ref: "#/components/schemas/FormContext" }
        name: { type: string }
        subjectType: { type: string, enum: [athlete, coach, team], default: athlete }
        fields:
          type: array
          items:
            type: object
            required: [key, kind]
            properties:
              key: { type: string }
              label: { type: string }
              kind: { $ref: "#/components/schemas/FieldKind" }
              config:
                description: >-
                  Per-kind configuration. A `scale` field takes {"min":n,"max":n}; a
                  `select` field takes {"options":["..."]} and answers are checked
                  against that list. A field that declares no config is unconstrained,
                  which is what keeps existing templates working.
    Answer:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        kind: { $ref: "#/components/schemas/FieldKind" }
        numericValue: { type: number, nullable: true }
        boolValue: { type: boolean, nullable: true }
        textValue: { type: string, nullable: true }
    FormInstance:
      type: object
      properties:
        id: { type: string, format: uuid }
        templateId: { type: string, format: uuid }
        context: { $ref: "#/components/schemas/FormContext" }
        subjectPersonId: { type: string, format: uuid, nullable: true }
        subjectTeamId: { type: string, format: uuid, nullable: true }
        contextRefType: { type: string, nullable: true }
        contextRefId: { type: string, format: uuid, nullable: true }
        submittedAt: { type: string, format: date-time }
        answers: { type: array, items: { $ref: "#/components/schemas/Answer" } }
    SubmitInstanceRequest:
      type: object
      required: [templateId]
      properties:
        templateId: { type: string, format: uuid }
        subjectPersonId: { type: string, format: uuid }
        subjectTeamId: { type: string, format: uuid }
        contextRefType: { type: string }
        contextRefId: { type: string, format: uuid }
        answers:
          type: array
          items:
            type: object
            required: [key]
            properties:
              key: { type: string }
              numericValue: { type: number }
              boolValue: { type: boolean }
              textValue: { type: string }
    InstanceSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        templateId: { type: string, format: uuid }
        context: { $ref: "#/components/schemas/FormContext" }
        templateName: { type: string }
        contextRefType: { type: string, nullable: true }
        contextRefId: { type: string, format: uuid, nullable: true }
        submittedAt: { type: string, format: date-time }
    ScoreAggregate:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        samples: { type: integer }
        average: { type: number }
        minimum: { type: number }
        maximum: { type: number }
    Drill:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    SessionBlock:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        drillId: { type: string, format: uuid, nullable: true }
        drillName: { type: string, nullable: true }
        durationMin: { type: integer, nullable: true }
        position: { type: integer }
        notes: { type: string, nullable: true }
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid, nullable: true }
        title: { type: string }
        scheduledAt: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        blocks: { type: array, items: { $ref: "#/components/schemas/SessionBlock" } }
    CreateSessionRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        teamId: { type: string, format: uuid }
        scheduledAt: { type: string, format: date-time }
        notes: { type: string }
        blocks:
          type: array
          items:
            type: object
            required: [title]
            properties:
              title: { type: string }
              drillId: { type: string, format: uuid }
              durationMin: { type: integer }
              notes: { type: string }
    Game:
      type: object
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        opponent: { type: string, nullable: true }
        kickoffAt: { type: string, format: date-time, nullable: true }
        homeAway: { type: string, enum: [home, away, neutral], nullable: true }
        ourScore: { type: integer, nullable: true }
        opponentScore: { type: integer, nullable: true }
        status: { type: string, enum: [scheduled, in_progress, completed, cancelled] }
        createdAt: { type: string, format: date-time }
    UpdateSessionRequest:
      type: object
      properties:
        title: { type: string }
        teamId: { type: string, format: uuid, nullable: true }
        scheduledAt: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
    AttendanceEntry:
      type: object
      description: >-
        One line of the register: a person, what they said, and what happened. Both halves
        are nullable — "has not replied" and "not recorded yet" are the state most lines
        are in most of the time. rsvpBy is not always personId: a parent answers for a
        child, and a coach answers for a player who has no login.
      properties:
        personId: { type: string, format: uuid }
        displayName: { type: string }
        jerseyNumber: { type: integer, nullable: true }
        position: { type: string, nullable: true }
        onRoster:
          type: boolean
          description: >-
            False for someone who was at the event but has since left the team. Their
            line stays on the sheet; show it as history, not as an unanswered squad member.
        rsvp: { type: string, enum: [going, maybe, not_going], nullable: true }
        rsvpNote: { type: string, nullable: true }
        rsvpAt: { type: string, format: date-time, nullable: true }
        rsvpBy: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [present, absent, late, excused], nullable: true }
        statusNote: { type: string, nullable: true }
        recordedAt: { type: string, format: date-time, nullable: true }
        recordedBy: { type: string, format: uuid, nullable: true }
    AttendanceCounts:
      type: object
      description: >-
        The squad's tally, whole, whatever the caller may see of the lines behind it. Each
        half carries a "neither" bucket, because a squad nobody asked and a squad that
        answered no are the same size and mean opposite things.
      properties:
        going: { type: integer }
        maybe: { type: integer }
        notGoing: { type: integer }
        noReply: { type: integer }
        present: { type: integer }
        absent: { type: integer }
        late: { type: integer }
        excused: { type: integer }
        notRecorded: { type: integer }
    AttendanceSheet:
      type: object
      properties:
        eventType: { type: string, enum: [game, session] }
        eventId: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        counts: { $ref: "#/components/schemas/AttendanceCounts" }
        entries:
          type: array
          items: { $ref: "#/components/schemas/AttendanceEntry" }
    RSVPRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [going, maybe, not_going] }
        note: { type: string, nullable: true }
        personId:
          type: string
          format: uuid
          description: >-
            Who is replying. Omit for yourself, which is the ordinary case. A parent sends
            a child's id; staff may send any player on the team, which is the common case
            in youth football where the reply arrived by text to the coach.
    RecordAttendanceRequest:
      type: object
      properties:
        status:
          type: string
          enum: [present, absent, late, excused]
          nullable: true
          description: >-
            Explicit null clears a line ticked by mistake — there is no value here that
            means "not recorded", and leaving one in place makes the register say
            something untrue. The recorded-at and recorded-by go with it.
        note: { type: string, nullable: true }
    CreateGameRequest:
      type: object
      properties:
        opponent: { type: string }
        kickoffAt: { type: string, format: date-time }
        homeAway: { type: string, enum: [home, away, neutral] }
    UpdateGameRequest:
      type: object
      description: >-
        Send ourScore and opponentScore together to record a result. Every nullable field
        here is a three-state PATCH: omit it to leave it alone, send a value to set it,
        send explicit null to clear it. kickoffAt included — a cancelled fixture's kickoff
        time can be unset.
      properties:
        opponent: { type: string, nullable: true }
        kickoffAt: { type: string, format: date-time, nullable: true }
        homeAway: { type: string, enum: [home, away, neutral], nullable: true }
        ourScore: { type: integer }
        opponentScore: { type: integer }
        status: { type: string, enum: [scheduled, in_progress, completed, cancelled] }
