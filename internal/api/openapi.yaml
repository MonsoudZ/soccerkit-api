openapi: 3.0.3
info:
  title: SoccerCoachKit API
  description: >-
    Backend for SoccerCoachKit — a coach → club evaluation platform. Models the
    whole castle (organizations, roles, persons, guardianships, time-bounded
    roster memberships, a generic evaluation engine, polymorphic sharing) while
    Phase 1 ships the solo-coach surface: identity, teams + roster, and the
    pre/post-game evaluation loop with cross-instance score aggregation.
  version: 0.2.0
servers:
  - url: /
    description: Current host
tags:
  - name: auth
  - name: me
  - name: roles
  - name: invitations
  - name: persons
  - name: teams
  - name: evaluation
  - name: sync

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness probe — is this process running?
      description: >
        Touches nothing and always answers 200 while the process is up. Use it for a
        supervisor's restart decision. Do NOT use it for load-balancer membership: it
        cannot tell you whether the process can serve a request, and a database that
        goes away after boot leaves it answering OK while every request fails.
      responses: { "200": { description: OK } }

  /ready:
    get:
      tags: [system]
      summary: Readiness probe — can this process serve a request?
      description: >
        Pings the database under a short timeout. This is the one a load balancer should
        use to decide whether to send traffic here.
      responses:
        "200": { description: Ready }
        "503":
          description: A dependency is unreachable; do not route traffic here
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  reason: { type: string }

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate a refresh token for a new token pair
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/v1/auth/apple:
    post:
      tags: [auth]
      summary: Sign in with Apple
      description: >
        Verifies an Apple identity token and resolves it to a Person: an account already
        linked by Apple subject, or a freshly provisioned identity — the same provisioning
        as email registration, including the seeded evaluation templates.


        This is the only way to obtain a session. There is no registration and no
        password login: they were removed because nothing shipped used them and they let
        anyone create an account at any address, which made an address a takeover
        primitive.


        It does NOT match an existing account by email address. When the address already
        belongs to another account this endpoint answers 409 EMAIL_ALREADY_REGISTERED —
        a state no API call can now produce, so it means the data needs looking at, not
        that the caller did something wrong.


        When the user hides their address — or Apple has not marked it verified — a stable
        synthesized address is used, which never collides with a real account.


        The response shape is the iOS app's, not the shared AuthResponse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityToken]
              properties:
                identityToken:
                  type: string
                  description: The identity token from ASAuthorizationAppleIDCredential.
                authorizationCode:
                  type: string
                  nullable: true
                  description: The one-time authorization code. Accepted, not yet used.
                fullName:
                  type: string
                  nullable: true
                  description: >
                    Apple sends the name only on the very first authorization, so send it
                    when present or the display name falls back to the email local part.
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Access token (JWT). Same token type as accessToken elsewhere.
                  refreshToken: { type: string }
                  personID: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409":
          description: >
            Two distinct cases, told apart by the error code, because a client may want
            to word them differently. EMAIL_ALREADY_REGISTERED — the address belongs to
            another account. CONFLICT — the Person id this Apple subject derives is
            already taken by a row this sign-in did not create. Neither is a retry: both
            mean somebody has to look at the data.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/v1/sync:
    get:
      tags: [sync]
      summary: Pull the changes this account has not seen
      description: >
        Delta sync for the offline-first iOS app. Returns every record written after the
        client's cursor, unioned across the projected domain tables and the generic
        document store, scoped to the authenticated account.


        Projected types (Team, Drill, Session, Person, Player, Event, Diagram) land in
        their real tables with columns projected out of the payload and the full payload
        retained; every other type round-trips losslessly through a generic store until
        it graduates. Either way the wire format is the same opaque {type, id, payload}.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: since
          schema: { type: string }
          description: >
            The cursor from a previous response. Omit for a full sync. An unparseable
            value is treated as the beginning rather than an error.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncPullResponse" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [sync]
      summary: Push local changes
      description: >
        Applies the client's changes in one transaction. Writes are last-write-wins
        within an account.


        A record naming a row this account does not own affects nothing and comes back in
        `conflicts`, so a rejected write is visible rather than silently lost. Rows created
        through the REST API are owned by no sync account and cannot be adopted this way.


        The response carries no cursor: `cursor` is always null. Pull owns the read
        position. Advancing it here would skip a second device's interleaved changes —
        seqs come from one global sequence, so a client told its own push's high-water
        mark never sees the rows another device wrote just below it. Echoing the request's
        cursor, which this used to do, rewinds a client whose pull has moved on since the
        request was built. Sending nothing leaves the client's position alone.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncPushRequest" }
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncPushResponse" }
        "400":
          description: >
            Malformed record, or a batch over the 1000-record limit. Nothing is written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/me:
    get:
      tags: [me]
      summary: The authenticated person and their org memberships
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      tags: [me]
      summary: Delete the authenticated account and all its data
      description: >
        Permanently erases the caller's account and everything it owns — their
        personal organization (and its teams, drills, sessions, templates, games
        and share-grants), their synced content, and their athletes' Person rows
        including PII (name, birthdate, medical notes). Runs in one transaction
        and is idempotent: a retry, or a delete of an already-gone account,
        returns 204. An athlete still rostered under another coach is preserved.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Account deleted (or already absent) }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/roles:
    get:
      tags: [roles]
      summary: The role catalogue — every role and exactly what it may do
      description: >
        The permission model the server enforces, published so a client can gate its UI
        on the same table rather than a second copy of it that drifts. Capabilities are
        strings ("roster.manage", "evaluation.submit"): treat an unrecognized one as a
        capability this client does not use yet, never as an error.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/RoleInfo" } }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/me/access:
    get:
      tags: [me]
      summary: What the caller may do in the organization they are acting in
      description: >
        The union of the caller's roles in one organization (X-Organization-ID, or their
        default org) with the capabilities those roles carry, the reach of their reads
        ("org" for staff, "own" for a parent or player), and the roles they may hand out.
        Roles are resolved per request rather than baked into the access token, so a role
        granted a moment ago shows up here without signing in again.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgHeader" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Access" }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/me/children:
    get:
      tags: [me]
      summary: The children the caller is the registered guardian of
      description: >
        The parent app's first call: everything else it shows hangs off these ids. Needs
        no organization — it is the caller's own household.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Person" } }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/members:
    get:
      tags: [roles]
      summary: Who belongs to the organization, and as what
      description: >
        One row per person with every role they hold here — the solo coach holds admin,
        director and coach and is one member, not three. Requires member.read.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgHeader" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/OrgMember" } }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [roles]
      summary: Grant a role to someone already in the organization
      description: >
        Requires member.grant AND that the role be no higher than the caller's own: a
        director cannot mint an admin. The target must already be linked to this
        organization (POST /persons puts them there) — an id is not consent, so this is
        not a way to enrol a stranger. Idempotent: re-granting a held role succeeds.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrantRoleRequest" }
      responses:
        "201":
          description: The person's roles as they now stand
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberRoles" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/members/{personId}/roles/{role}:
    delete:
      tags: [roles]
      summary: Take one role away from someone
      description: >
        Removes a role, never the person: someone who is no longer a coach is usually
        still a parent, and their records survive the demotion. Requires member.revoke
        and the same rank ceiling as granting. Revoking the organization's last admin is
        refused with 409 — nobody left could grant it back.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OrgHeader" }
        - { name: personId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: role, in: path, required: true, schema: { $ref: "#/components/schemas/Role" } }
      responses:
        "200":
          description: The person's remaining roles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberRoles" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { description: They do not hold that role here }
        "409": { description: An organization must keep at least one admin }

  /api/v1/persons/{id}/guardians:
    post:
      tags: [persons]
      summary: Link a parent to a child
      description: >
        The join the parent tier stands on: a parent's reads are scoped to the children
        linked here, so a parent membership with no link sees nothing. Staff only
        (guardian.link); both people must already be visible in the organization.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OrgHeader" }
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinkGuardianRequest" }
      responses:
        "201": { description: Linked (idempotent) }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/invitations:
    get:
      tags: [invitations]
      summary: What this organization has invited, and what came of it
      description: >
        Newest first, including accepted and revoked rows. Requires invite.send. Tokens
        are never included: an invitation token crosses the wire exactly once, in the
        response that created it.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OrgHeader" }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Invitation" } }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [invitations]
      summary: Invite somebody into this organization
      description: >
        The only way an account that signed in on its own joins an organization that is
        not its own. Returns a one-time `token` — put it in the link you send, and do not
        expect to read it again; the database holds only its hash, so a lost invitation is
        reissued rather than recovered.


        Requires invite.send, under the same ceiling a direct grant is under: an
        invitation must never reach further than POST /members would, or "invite yourself
        as admin, then accept" is a one-step takeover. A coach (who holds no member.grant)
        is capped strictly below their own rank — the parents and players of their own
        athletes.


        For role=parent, `childPersonIds` names the athletes the redeemer becomes the
        guardian of. That link is the whole parent tier: a parent membership with no
        guardianship can see nothing.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvitationRequest" }
      responses:
        "201":
          description: Created — the only response that carries the token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedInvitation" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { description: A named child is not visible in this organization }

  /api/v1/invitations/preview:
    post:
      tags: [invitations]
      summary: What am I being asked to join?
      description: >
        Resolves a token to the club, the role and the children it is about, without
        redeeming it, so the app can show the person what they are agreeing to. Needs an
        authenticated caller (sign in with Apple first) and the token.


        A POST with the token in the body, not a GET with it in the query: the token is a
        credential, and a URL ends up in request logs and proxy access logs. /auth/refresh
        takes its token in a body for the same reason.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptInvitationRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "404": { description: That token matches no invitation }

  /api/v1/invitations/accept:
    post:
      tags: [invitations]
      summary: Redeem an invitation for the authenticated account
      description: >
        Creates the membership — and, for a parent invitation, the guardianships — for
        the account that presented the token. Never for an id in the request: that is the
        whole security model, and why an invitation cannot be redeemed on somebody else's
        behalf.


        Single use. Two devices opening the same forwarded link produce one membership and
        one 409. An invitation bound to an email address may only be redeemed by an
        account whose Apple-verified address matches.


        Answers with the caller's new access in that organization, so the next screen does
        not need another round trip.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptInvitationRequest" }
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationAccepted" }
        "403": { description: Issued to a different email address }
        "404": { description: That token matches no invitation }
        "409": { description: Already used, revoked, or expired }

  /api/v1/invitations/{id}:
    delete:
      tags: [invitations]
      summary: Revoke an outstanding invitation
      description: >
        Kills the link. An invitation that was already accepted is not revoked here — what
        to remove then is the membership it created, at
        DELETE /members/{personId}/roles/{role}. You may revoke what you sent; revoking
        somebody else's takes member.grant.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OrgHeader" }
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [revoked] }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: Already accepted or already revoked }

  /api/v1/persons:
    post:
      tags: [persons]
      summary: Add a person (athlete) to your organization
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePersonRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/persons/{id}:
    get:
      tags: [persons]
      summary: Get a person
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/persons/{id}/instances:
    get:
      tags: [persons, evaluation]
      summary: List a person's evaluation instances (most recent first)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { in: query, name: context, schema: { $ref: "#/components/schemas/FormContext" } }
        - { in: query, name: limit, schema: { type: integer, default: 50 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/InstanceSummary" } }
  /api/v1/persons/{id}/aggregate:
    get:
      tags: [persons, evaluation]
      summary: Cross-instance score averages for an athlete (readiness mean / effort trend)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { in: query, name: context, schema: { $ref: "#/components/schemas/FormContext" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ScoreAggregate" } }

  /api/v1/teams:
    get:
      tags: [teams]
      summary: List teams in your organization
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgHeader" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Team" } }
    post:
      tags: [teams]
      summary: Create a team
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTeamRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
  /api/v1/teams/{id}:
    get:
      tags: [teams]
      summary: Get a team with its active roster
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  team: { $ref: "#/components/schemas/Team" }
                  roster: { type: array, items: { $ref: "#/components/schemas/RosterEntry" } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [teams]
      summary: Delete a team
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/teams/{id}/roster:
    post:
      tags: [teams]
      summary: Add a person to the team roster (opens a time-bounded membership)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddRosterRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RosterEntry" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/teams/{id}/roster/{personId}:
    delete:
      tags: [teams]
      summary: End a player's active roster membership (leave / move)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { in: path, name: personId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/templates:
    get:
      tags: [evaluation]
      summary: List evaluation templates available to you
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OrgHeader" }
        - { in: query, name: context, schema: { $ref: "#/components/schemas/FormContext" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FormTemplate" } }
    post:
      tags: [evaluation]
      summary: Create a custom evaluation template
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTemplateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormTemplate" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/templates/{id}:
    get:
      tags: [evaluation]
      summary: Get a template with its fields
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormTemplate" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/form-instances:
    post:
      tags: [evaluation]
      summary: Submit a filled-out evaluation (instance + normalized answers)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitInstanceRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormInstance" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/form-instances/{id}:
    get:
      tags: [evaluation]
      summary: Get an evaluation instance with its answers
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormInstance" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/drills:
