        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Drill" }

  /api/v1/sessions:
    get:
      tags: [content]
      summary: List training sessions
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OrgHeader" }
        - { in: query, name: teamId, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Session" } }
    post:
      tags: [content]
      summary: Create a training session with blocks
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSessionRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /api/v1/sessions/{id}:
    get:
      tags: [content]
      summary: Get a session with its blocks
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [content]
      summary: Delete a session
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/v1/teams/{id}/games:
    get:
      tags: [games]
      summary: List a team's games
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Game" } }
    post:
      tags: [games]
      summary: Schedule a game
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGameRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Game" }
  /api/v1/games/{id}:
    get:
      tags: [games]
      summary: Get a game
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Game" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [games]
      summary: Update a game (record kickoff, status, and result)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateGameRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Game" }
        "400": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    OrgHeader:
      in: header
      name: X-Organization-ID
      required: false
      description: Act within a specific organization; defaults to your single/first org.
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Ok:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties: { ok: { type: boolean } }
  schemas:
    SyncRecord:
      type: object
      description: One synced entity. The payload is opaque to the server beyond the few columns it projects out.
      properties:
        type:
          type: string
          description: Client type name, e.g. Team, Drill, Session, Person, Player, Event, Diagram, Prefs.
          example: Team
        id:
          type: string
          description: >
            The client's id for the record. A UUID for every projected type; free-form
            text for types held in the generic store.
        payload:
          type: object
          additionalProperties: true
          nullable: true
    SyncKey:
      type: object
      description: Identifies a record without its body, used for deletes.
      properties:
        type: { type: string }
        id: { type: string }
    SyncPullResponse:
      type: object
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/SyncRecord" }
        deletes:
          type: array
          description: Tombstones — records deleted since the client's cursor.
          items: { $ref: "#/components/schemas/SyncKey" }
        cursor:
          type: string
          nullable: true
          description: Pass as `since` on the next pull.
    SyncPushRequest:
      type: object
      properties:
        upserts:
          type: array
          items: { $ref: "#/components/schemas/SyncRecord" }
        deletes:
          type: array
          items: { $ref: "#/components/schemas/SyncKey" }
        cursor:
          type: string
          nullable: true
          description: >-
            Where the client has read up to. Accepted and ignored — the response
            does not echo it back. Only a pull advances the cursor.
      description: At most 1000 records across upserts and deletes combined.
    SyncPushResponse:
      type: object
      properties:
        cursor:
          type: string
          nullable: true
          description: >-
            Always null. Present for shape stability; a push never moves the
            client's read position.
        conflicts:
          type: array
          description: >
            Records that were not applied because this account does not own the target
            row. Empty on a clean push.
          items: { $ref: "#/components/schemas/SyncRecord" }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
    Role:
      type: string
      enum: [admin, director, coach, parent, player]
      description: >
        A person's standing in ONE organization, never a property of the person: the
        same human is a director at their club and a parent at their child's. A person
        holds several at once (a solo coach signs up as admin + director + coach), and
        permissions are the union.
    Capability:
      type: string
      description: >
        One thing a person may do, named for the product verb rather than the endpoint
        ("roster.manage", "evaluation.submit", "member.grant"). The full list per role is
        at GET /roles; treat an unknown value as one this client does not use yet.
      example: roster.manage
    RoleInfo:
      type: object
      properties:
        role: { $ref: "#/components/schemas/Role" }
        label: { type: string, description: "Human name, e.g. Director" }
        description: { type: string }
        rank:
          type: integer
          description: >
            Authority, for one question only — may this caller hand out that role? A
            parent outranks a player and neither can touch a team.
        capabilities: { type: array, items: { $ref: "#/components/schemas/Capability" } }
    Access:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        roles:
          type: array
          description: Every role the caller holds here, most privileged first.
          items: { $ref: "#/components/schemas/Role" }
        capabilities:
          type: array
          description: The union of those roles' capabilities.
          items: { $ref: "#/components/schemas/Capability" }
        scope:
          type: string
          enum: [none, own, org]
          description: >
            How far the caller's reads over people, teams and evaluations reach. Staff
            get "org"; a parent or player gets "own" — themselves and the children they
            are guardian of.
        grantableRoles:
          type: array
          description: The roles this caller may hand out — populate a role picker from this.
          items: { $ref: "#/components/schemas/Role" }
        invitableRoles:
          type: array
          description: >
            The roles this caller may invite somebody as. Usually the same as
            grantableRoles; for a coach, who may invite but not staff, it is strictly the
            roles below their own.
          items: { $ref: "#/components/schemas/Role" }
    OrgMember:
      type: object
      properties:
        personId: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string, nullable: true }
        roles: { type: array, items: { $ref: "#/components/schemas/Role" } }
        joinedAt: { type: string, format: date-time }
    MemberRoles:
      type: object
      properties:
        personId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        roles: { type: array, items: { $ref: "#/components/schemas/Role" } }
    GrantRoleRequest:
      type: object
      required: [personId, role]
      properties:
        personId: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
    PersonRef:
      type: object
      description: A person named inside another payload — who they are, and no more.
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
    Invitation:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        status:
          type: string
          enum: [pending, accepted, revoked, expired]
          description: Derived from the timestamps; an invitation expires without anyone writing a row.
        email:
          type: string
          nullable: true
          description: The address this invitation is bound to, if any.
        note: { type: string, nullable: true }
        invitedByPersonId: { type: string, format: uuid, nullable: true }
        children:
          type: array
          description: The athletes a parent invitation makes its redeemer the guardian of.
          items: { $ref: "#/components/schemas/PersonRef" }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        acceptedAt: { type: string, format: date-time, nullable: true }
    CreatedInvitation:
      allOf:
        - $ref: "#/components/schemas/Invitation"
        - type: object
          properties:
            token:
              type: string
              description: >
                The invitation token, returned exactly once. Put it in the link you send.
                It is stored only as a hash, so it cannot be read back — reissue instead.
              example: skinv_8fQ2...
    CreateInvitationRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        note: { type: string }
        email:
          type: string
          description: >
            Optional. Binds the invitation to one address: only an account whose
            Apple-verified address matches may redeem it, which makes a forwarded link
            useless. Leave it unset for anyone who might use Hide My Email — they sign in
            with a private relay that will never match what you typed, and a bound
            invitation would lock out the person it was for.
        childPersonIds:
          type: array
          description: >
            For role=parent only: the athletes the redeemer becomes the guardian of. Each
            must already be visible in this organization.
          items: { type: string, format: uuid }
    AcceptInvitationRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    InvitationAccepted:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        linkedChildren:
          type: array
          items: { $ref: "#/components/schemas/PersonRef" }
        access: { $ref: "#/components/schemas/Access" }
    LinkGuardianRequest:
      type: object
      required: [guardianPersonId]
      properties:
        guardianPersonId: { type: string, format: uuid }
    FormContext:
      type: string
      enum: [tryout, pre_game, post_game, development, movement, coach_review]
    FieldKind:
      type: string
      enum: [scale, bool, number, text, select]
    Person:
      type: object
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        givenName: { type: string, nullable: true }
        familyName: { type: string, nullable: true }
        birthdate: { type: string, nullable: true, description: "YYYY-MM-DD" }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        emergencyContactName: { type: string, nullable: true }
        emergencyContactPhone: { type: string, nullable: true }
        medicalNotes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    Membership:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        organizationKind: { type: string, enum: [personal, club] }
        role: { $ref: "#/components/schemas/Role" }
    Me:
      type: object
      properties:
        person: { $ref: "#/components/schemas/Person" }
        memberships: { type: array, items: { $ref: "#/components/schemas/Membership" } }
    AuthResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        me: { $ref: "#/components/schemas/Me" }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    CreatePersonRequest:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string }
        givenName: { type: string }
        familyName: { type: string }
        birthdate: { type: string, description: "YYYY-MM-DD" }
        email: { type: string }
        phone: { type: string }
        emergencyContactName: { type: string }
        emergencyContactPhone: { type: string }
        medicalNotes: { type: string }
        role:
          type: string
          enum: [player, parent]
          default: player
          description: >
            Role the new person holds in your organization. Every person created here is
            enrolled in it — a person with no organizational linkage would be visible to
            nobody, including you. Only the unprivileged roles can be granted this way,
            because the person has no login.
    Team:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        ageGroup: { type: string, nullable: true }
        season: { type: string, nullable: true }
        activeRosterCount: { type: integer }
        createdAt: { type: string, format: date-time }
    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        ageGroup: { type: string }
        season: { type: string }
    RosterEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        personId: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string, nullable: true }
        birthdate: { type: string, nullable: true }
        jerseyNumber: { type: integer, nullable: true }
        position: { type: string, nullable: true }
        joinedOn: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }
    AddRosterRequest:
      type: object
      required: [personId]
      properties:
        personId: { type: string, format: uuid }
        jerseyNumber: { type: integer }
        position: { type: string }
        joinedOn: { type: string, description: "YYYY-MM-DD; defaults to today" }
    FormField:
      type: object
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        label: { type: string }
        kind: { $ref: "#/components/schemas/FieldKind" }
        position: { type: integer }
        config: { nullable: true }
    FormTemplate:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid, nullable: true }
        context: { $ref: "#/components/schemas/FormContext" }
        name: { type: string }
        subjectType: { type: string, enum: [athlete, coach, team] }
        version: { type: integer }
        isSeed: { type: boolean }
        fields: { type: array, items: { $ref: "#/components/schemas/FormField" } }
    CreateTemplateRequest:
      type: object
      required: [context, name, fields]
      properties:
        context: { $ref: "#/components/schemas/FormContext" }
        name: { type: string }
        subjectType: { type: string, enum: [athlete, coach, team], default: athlete }
        fields:
          type: array
          items:
            type: object
            required: [key, kind]
            properties:
              key: { type: string }
              label: { type: string }
              kind: { $ref: "#/components/schemas/FieldKind" }
              config: {}
    Answer:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        kind: { $ref: "#/components/schemas/FieldKind" }
        numericValue: { type: number, nullable: true }
        boolValue: { type: boolean, nullable: true }
        textValue: { type: string, nullable: true }
    FormInstance:
      type: object
      properties:
        id: { type: string, format: uuid }
        templateId: { type: string, format: uuid }
        context: { $ref: "#/components/schemas/FormContext" }
        subjectPersonId: { type: string, format: uuid, nullable: true }
        subjectTeamId: { type: string, format: uuid, nullable: true }
        contextRefType: { type: string, nullable: true }
        contextRefId: { type: string, format: uuid, nullable: true }
        submittedAt: { type: string, format: date-time }
        answers: { type: array, items: { $ref: "#/components/schemas/Answer" } }
    SubmitInstanceRequest:
      type: object
      required: [templateId]
      properties:
        templateId: { type: string, format: uuid }
        subjectPersonId: { type: string, format: uuid }
        subjectTeamId: { type: string, format: uuid }
        contextRefType: { type: string }
        contextRefId: { type: string, format: uuid }
        answers:
          type: array
          items:
            type: object
            required: [key]
            properties:
              key: { type: string }
              numericValue: { type: number }
              boolValue: { type: boolean }
              textValue: { type: string }
    InstanceSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        templateId: { type: string, format: uuid }
        context: { $ref: "#/components/schemas/FormContext" }
        templateName: { type: string }
        contextRefType: { type: string, nullable: true }
        contextRefId: { type: string, format: uuid, nullable: true }
        submittedAt: { type: string, format: date-time }
    ScoreAggregate:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        samples: { type: integer }
        average: { type: number }
        minimum: { type: number }
        maximum: { type: number }
    Drill:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    SessionBlock:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        drillId: { type: string, format: uuid, nullable: true }
        drillName: { type: string, nullable: true }
        durationMin: { type: integer, nullable: true }
        position: { type: integer }
        notes: { type: string, nullable: true }
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid, nullable: true }
        title: { type: string }
        scheduledAt: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        blocks: { type: array, items: { $ref: "#/components/schemas/SessionBlock" } }
    CreateSessionRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        teamId: { type: string, format: uuid }
        scheduledAt: { type: string, format: date-time }
        notes: { type: string }
        blocks:
          type: array
          items:
            type: object
            required: [title]
            properties:
              title: { type: string }
              drillId: { type: string, format: uuid }
              durationMin: { type: integer }
              notes: { type: string }
    Game:
      type: object
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        opponent: { type: string, nullable: true }
        kickoffAt: { type: string, format: date-time, nullable: true }
        homeAway: { type: string, enum: [home, away, neutral], nullable: true }
        ourScore: { type: integer, nullable: true }
        opponentScore: { type: integer, nullable: true }
        status: { type: string, enum: [scheduled, in_progress, completed, cancelled] }
        createdAt: { type: string, format: date-time }
    CreateGameRequest:
      type: object
      properties:
        opponent: { type: string }
        kickoffAt: { type: string, format: date-time }
        homeAway: { type: string, enum: [home, away, neutral] }
    UpdateGameRequest:
      type: object
      description: Send ourScore and opponentScore together to record a result.
      properties:
        opponent: { type: string, nullable: true }
        kickoffAt: { type: string, format: date-time }
        homeAway: { type: string, enum: [home, away, neutral], nullable: true }
        ourScore: { type: integer }
        opponentScore: { type: integer }
        status: { type: string, enum: [scheduled, in_progress, completed, cancelled] }
