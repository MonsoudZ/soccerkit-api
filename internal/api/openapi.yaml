openapi: 3.0.3
info:
  title: SoccerCoachKit API
  description: >-
    Backend for SoccerCoachKit — a coach → club evaluation platform. Models the
    whole castle (organizations, roles, persons, guardianships, time-bounded
    roster memberships, a generic evaluation engine, polymorphic sharing) while
    Phase 1 ships the solo-coach surface: identity, teams + roster, and the
    pre/post-game evaluation loop with cross-instance score aggregation.
  version: 0.2.0
servers:
  - url: /
    description: Current host
tags:
  - name: auth
  - name: me
  - name: persons
  - name: teams
  - name: evaluation
  - name: sync

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness probe
      responses: { "200": { description: OK } }

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Create a coach account (provisions Person + UserAccount + personal Organization + admin/director/coach memberships + seeded templates)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Exchange credentials for tokens
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate a refresh token for a new token pair
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/v1/auth/apple:
    post:
      tags: [auth]
      summary: Sign in with Apple
      description: >
        Verifies an Apple identity token and resolves it to a Person: an account already
        linked by Apple subject, an account matched by a verified email address (linked
        on the spot), or a freshly provisioned identity — the same provisioning as email
        registration, including the seeded evaluation templates.


        Linking to an existing password account requires Apple to have marked the address
        verified. When the user hides their address, a stable synthesized one is used,
        which never matches an existing account and so always provisions anew.


        The response shape is the iOS app's, not the shared AuthResponse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityToken]
              properties:
                identityToken:
                  type: string
                  description: The identity token from ASAuthorizationAppleIDCredential.
                authorizationCode:
                  type: string
                  nullable: true
                  description: The one-time authorization code. Accepted, not yet used.
                fullName:
                  type: string
                  nullable: true
                  description: >
                    Apple sends the name only on the very first authorization, so send it
                    when present or the display name falls back to the email local part.
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Access token (JWT). Same token type as accessToken elsewhere.
                  refreshToken: { type: string }
                  personID: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/v1/sync:
    get:
      tags: [sync]
      summary: Pull the changes this account has not seen
      description: >
        Delta sync for the offline-first iOS app. Returns every record written after the
        client's cursor, unioned across the projected domain tables and the generic
        document store, scoped to the authenticated account.


        Projected types (Team, Drill, Session, Person, Player, Event, Diagram) land in
        their real tables with columns projected out of the payload and the full payload
        retained; every other type round-trips losslessly through a generic store until
        it graduates. Either way the wire format is the same opaque {type, id, payload}.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: since
          schema: { type: string }
          description: >
            The cursor from a previous response. Omit for a full sync. An unparseable
            value is treated as the beginning rather than an error.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncPullResponse" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [sync]
      summary: Push local changes
      description: >
        Applies the client's changes in one transaction. Writes are last-write-wins
        within an account.


        A record naming a row this account does not own affects nothing and comes back in
        `conflicts`, so a rejected write is visible rather than silently lost. Rows created
        through the REST API are owned by no sync account and cannot be adopted this way.


        The cursor is echoed, not advanced — only a pull advances it, so a second device's
        interleaved changes are never skipped.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncPushRequest" }
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncPushResponse" }
        "400":
          description: >
            Malformed record, or a batch over the 1000-record limit. Nothing is written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/me:
    get:
      tags: [me]
      summary: The authenticated person and their org memberships
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      tags: [me]
      summary: Delete the authenticated account and all its data
      description: >
        Permanently erases the caller's account and everything it owns — their
        personal organization (and its teams, drills, sessions, templates, games
        and share-grants), their synced content, and their athletes' Person rows
        including PII (name, birthdate, medical notes). Runs in one transaction
        and is idempotent: a retry, or a delete of an already-gone account,
        returns 204. An athlete still rostered under another coach is preserved.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Account deleted (or already absent) }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/persons:
    post:
      tags: [persons]
      summary: Add a person (athlete) to your organization
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePersonRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/persons/{id}:
    get:
      tags: [persons]
      summary: Get a person
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/persons/{id}/instances:
    get:
      tags: [persons, evaluation]
      summary: List a person's evaluation instances (most recent first)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { in: query, name: context, schema: { $ref: "#/components/schemas/FormContext" } }
        - { in: query, name: limit, schema: { type: integer, default: 50 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/InstanceSummary" } }
  /api/v1/persons/{id}/aggregate:
    get:
      tags: [persons, evaluation]
      summary: Cross-instance score averages for an athlete (readiness mean / effort trend)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { in: query, name: context, schema: { $ref: "#/components/schemas/FormContext" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ScoreAggregate" } }

  /api/v1/teams:
    get:
      tags: [teams]
      summary: List teams in your organization
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgHeader" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Team" } }
    post:
      tags: [teams]
      summary: Create a team
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTeamRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
  /api/v1/teams/{id}:
    get:
      tags: [teams]
      summary: Get a team with its active roster
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  team: { $ref: "#/components/schemas/Team" }
                  roster: { type: array, items: { $ref: "#/components/schemas/RosterEntry" } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [teams]
      summary: Delete a team
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/teams/{id}/roster:
    post:
      tags: [teams]
      summary: Add a person to the team roster (opens a time-bounded membership)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddRosterRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RosterEntry" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/teams/{id}/roster/{personId}:
    delete:
      tags: [teams]
      summary: End a player's active roster membership (leave / move)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { in: path, name: personId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/templates:
    get:
      tags: [evaluation]
      summary: List evaluation templates available to you
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OrgHeader" }
        - { in: query, name: context, schema: { $ref: "#/components/schemas/FormContext" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FormTemplate" } }
    post:
      tags: [evaluation]
      summary: Create a custom evaluation template
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTemplateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormTemplate" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/templates/{id}:
    get:
      tags: [evaluation]
      summary: Get a template with its fields
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormTemplate" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/form-instances:
    post:
      tags: [evaluation]
      summary: Submit a filled-out evaluation (instance + normalized answers)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitInstanceRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormInstance" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/form-instances/{id}:
    get:
      tags: [evaluation]
      summary: Get an evaluation instance with its answers
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormInstance" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/drills:
    get:
      tags: [content]
      summary: List drills in your organization
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgHeader" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Drill" } }
    post:
      tags: [content]
      summary: Create a drill
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Drill" }

  /api/v1/sessions:
    get:
      tags: [content]
      summary: List training sessions
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OrgHeader" }
        - { in: query, name: teamId, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Session" } }
    post:
      tags: [content]
      summary: Create a training session with blocks
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSessionRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /api/v1/sessions/{id}:
    get:
      tags: [content]
      summary: Get a session with its blocks
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [content]
      summary: Delete a session
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/v1/teams/{id}/games:
    get:
      tags: [games]
      summary: List a team's games
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Game" } }
    post:
      tags: [games]
      summary: Schedule a game
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGameRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Game" }
  /api/v1/games/{id}:
    get:
      tags: [games]
      summary: Get a game
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Game" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [games]
      summary: Update a game (record kickoff, status, and result)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateGameRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Game" }
        "400": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    OrgHeader:
      in: header
      name: X-Organization-ID
      required: false
      description: Act within a specific organization; defaults to your single/first org.
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Ok:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties: { ok: { type: boolean } }
  schemas:
    SyncRecord:
      type: object
      description: One synced entity. The payload is opaque to the server beyond the few columns it projects out.
      properties:
        type:
          type: string
          description: Client type name, e.g. Team, Drill, Session, Person, Player, Event, Diagram, Prefs.
          example: Team
        id:
          type: string
          description: >
            The client's id for the record. A UUID for every projected type; free-form
            text for types held in the generic store.
        payload:
          type: object
          additionalProperties: true
          nullable: true
    SyncKey:
      type: object
      description: Identifies a record without its body, used for deletes.
      properties:
        type: { type: string }
        id: { type: string }
    SyncPullResponse:
      type: object
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/SyncRecord" }
        deletes:
          type: array
          description: Tombstones — records deleted since the client's cursor.
          items: { $ref: "#/components/schemas/SyncKey" }
        cursor:
          type: string
          nullable: true
          description: Pass as `since` on the next pull.
    SyncPushRequest:
      type: object
      properties:
        upserts:
          type: array
          items: { $ref: "#/components/schemas/SyncRecord" }
        deletes:
          type: array
          items: { $ref: "#/components/schemas/SyncKey" }
        cursor:
          type: string
          nullable: true
          description: Echoed back unchanged. Only a pull advances the cursor.
      description: At most 1000 records across upserts and deletes combined.
    SyncPushResponse:
      type: object
      properties:
        cursor:
          type: string
          nullable: true
        conflicts:
          type: array
          description: >
            Records that were not applied because this account does not own the target
            row. Empty on a clean push.
          items: { $ref: "#/components/schemas/SyncRecord" }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
    Role:
      type: string
      enum: [admin, director, coach, parent, player]
    FormContext:
      type: string
      enum: [tryout, pre_game, post_game, development, movement, coach_review]
    FieldKind:
      type: string
      enum: [scale, bool, number, text, select]
    Person:
      type: object
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        givenName: { type: string, nullable: true }
        familyName: { type: string, nullable: true }
        birthdate: { type: string, nullable: true, description: "YYYY-MM-DD" }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        emergencyContactName: { type: string, nullable: true }
        emergencyContactPhone: { type: string, nullable: true }
        medicalNotes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    Membership:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        organizationKind: { type: string, enum: [personal, club] }
        role: { $ref: "#/components/schemas/Role" }
    Me:
      type: object
      properties:
        person: { $ref: "#/components/schemas/Person" }
        memberships: { type: array, items: { $ref: "#/components/schemas/Membership" } }
    AuthResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        me: { $ref: "#/components/schemas/Me" }
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        displayName: { type: string }
        organizationName: { type: string, description: Optional; defaults to a personal org }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    CreatePersonRequest:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string }
        givenName: { type: string }
        familyName: { type: string }
        birthdate: { type: string, description: "YYYY-MM-DD" }
        email: { type: string }
        phone: { type: string }
        emergencyContactName: { type: string }
        emergencyContactPhone: { type: string }
        medicalNotes: { type: string }
        role:
          type: string
          enum: [player, parent]
          default: player
          description: >
            Role the new person holds in your organization. Every person created here is
            enrolled in it — a person with no organizational linkage would be visible to
            nobody, including you. Only the unprivileged roles can be granted this way,
            because the person has no login.
    Team:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        ageGroup: { type: string, nullable: true }
        season: { type: string, nullable: true }
        activeRosterCount: { type: integer }
        createdAt: { type: string, format: date-time }
    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        ageGroup: { type: string }
        season: { type: string }
    RosterEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
