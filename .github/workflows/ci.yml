name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soccerkit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/soccerkit_test?sslmode=disable

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify sqlc output is up to date
        env:
          # setup-go v7 exports GOTOOLCHAIN=local; v5 left it at auto. sqlc is built with
          # a newer Go than this module pins, so `go install` has to fetch that toolchain
          # to compile the tool -- which "local" forbids, and the step failed on a line
          # nobody had touched. Scoped to this step on purpose: installing a tool is the
          # one place a different toolchain is wanted, and the project's own build and
          # test below stay pinned to what go.mod asks for.
          GOTOOLCHAIN: auto
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          sqlc generate
          git diff --exit-code -- internal/store
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      # The Dockerfile pins its own Go image, so a pin that has drifted behind go.mod
      # would otherwise surface only at deploy time. Both sides are strict now --
      # setup-go v7 exports GOTOOLCHAIN=local, and the golang image sets it too -- so a
      # drifted pin fails here rather than downloading its way past the problem.
      # Building the image is what turns that into a red check instead of a broken deploy.
      - run: docker build -t soccerkit-api:ci .
