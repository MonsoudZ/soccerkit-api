name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soccerkit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/soccerkit_test?sslmode=disable

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify sqlc output is up to date
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          sqlc generate
          git diff --exit-code -- internal/store
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      # The Dockerfile pins its own Go image, so a pin that has drifted behind
      # go.mod is invisible to every step above: setup-go leaves GOTOOLCHAIN at
      # "auto" and quietly downloads whatever go.mod asks for, while the golang
      # image sets GOTOOLCHAIN=local and fails outright. Building the image is
      # what turns that into a red check instead of a broken deploy.
      - run: docker build -t soccerkit-api:ci .
